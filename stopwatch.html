<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Coach Stopwatch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #000000;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #000000;
            overflow: hidden;
        }

        header {
            background: #000000;
            color: white;
            padding: 40px 30px 20px;
            text-align: center;
            border-bottom: 2px solid #222;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 900;
            letter-spacing: 0.02em;
        }

        .tagline {
            font-size: 0.9em;
            opacity: 0.6;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .stopwatch-container {
            padding: 60px 30px;
            text-align: center;
        }

        .stopwatch-container h2 {
            margin-bottom: 10px;
            color: #fff;
            font-size: 1.2em;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .stopwatch-description {
            color: #666;
            margin-bottom: 60px;
            font-size: 0.9em;
            letter-spacing: 0.05em;
        }

        .stopwatch-display {
            background: #000000;
            padding: 60px 40px;
            margin-bottom: 50px;
            border: 3px solid #333;
        }

        .stopwatch-time {
            font-size: 6em;
            font-weight: 900;
            color: white;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.1em;
        }

        .stopwatch-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 60px;
        }

        .stopwatch-btn {
            padding: 18px 50px;
            border: 2px solid #fff;
            border-radius: 0;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            background: transparent;
            color: #fff;
        }

        .btn-start {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-start:hover {
            background: transparent;
            color: #fff;
        }

        .btn-stop {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-stop:hover {
            background: transparent;
            color: #fff;
        }

        .btn-reset {
            background: transparent;
            color: #fff;
            border-color: #fff;
        }

        .btn-reset:hover {
            background: #fff;
            color: #000;
        }

        .score-section {
            margin-top: 60px;
            border-top: 2px solid #222;
            padding-top: 40px;
        }

        .team-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
        }

        .team {
            flex: 1;
            max-width: 300px;
            text-align: center;
        }

        .team h3 {
            color: #fff;
            font-size: 1.2em;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .goals-display {
            min-height: 80px;
            background: #000;
            border: 2px solid #333;
            padding: 20px;
            margin-bottom: 20px;
            font-size: 2em;
            line-height: 1.5;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .goal-btn {
            padding: 12px 30px;
            border: 2px solid #fff;
            border-radius: 0;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: transparent;
            color: #fff;
            width: 100%;
        }

        .goal-btn:hover {
            background: #fff;
            color: #000;
        }

        @keyframes goalPop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        footer {
            background: #000000;
            padding: 30px 20px;
            text-align: center;
            color: #444;
            border-top: 2px solid #222;
            margin-top: 40px;
            font-size: 0.8em;
            letter-spacing: 0.1em;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .stopwatch-time {
                font-size: 2.5em;
            }

            .stopwatch-controls {
                flex-direction: column;
                gap: 10px;
            }

            .stopwatch-btn {
                width: 100%;
                padding: 12px 20px;
            }

            .team-container {
                flex-direction: column;
                gap: 30px;
            }

            .team {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>FOOTBALLREMIXED</h1>
            <p class="tagline">Stopwatch</p>
        </header>

        <div class="stopwatch-container">
            <h2>Timer</h2>
            <p class="stopwatch-description">Track drills & sessions</p>

            <div class="stopwatch-display">
                <div id="stopwatchTime" class="stopwatch-time">00:00.00</div>
            </div>

            <div class="stopwatch-controls">
                <button id="startBtn" class="stopwatch-btn btn-start">Start</button>
                <button id="resetBtn" class="stopwatch-btn btn-reset">Reset</button>
            </div>

            <div class="score-section">
                <div class="team-container">
                    <div class="team home-team">
                        <h3>Home</h3>
                        <div class="goals-display" id="homeGoals"></div>
                        <button id="homeGoalBtn" class="goal-btn">⚽️ Goal</button>
                    </div>
                    <div class="team away-team">
                        <h3>Away</h3>
                        <div class="goals-display" id="awayGoals"></div>
                        <button id="awayGoalBtn" class="goal-btn">⚽️ Goal</button>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>FOOTBALLREMIXED © 2026</p>
        </footer>
    </div>

    <script>
        // Stopwatch functionality
        let stopwatchInterval = null;
        let stopwatchTime = 0;
        let isStopwatchRunning = false;

        const stopwatchDisplay = document.getElementById('stopwatchTime');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        function formatTime(milliseconds) {
            const totalSeconds = Math.floor(milliseconds / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const centiseconds = Math.floor((milliseconds % 1000) / 10);

            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(centiseconds).padStart(2, '0')}`;
        }

        function updateStopwatchDisplay() {
            stopwatchDisplay.textContent = formatTime(stopwatchTime);
        }

        function startStopwatch() {
            if (!isStopwatchRunning) {
                isStopwatchRunning = true;
                const startTime = Date.now() - stopwatchTime;

                stopwatchInterval = setInterval(() => {
                    stopwatchTime = Date.now() - startTime;
                    updateStopwatchDisplay();
                }, 10);

                startBtn.textContent = 'Stop';
                startBtn.classList.remove('btn-start');
                startBtn.classList.add('btn-stop');
            } else {
                isStopwatchRunning = false;
                clearInterval(stopwatchInterval);
                startBtn.textContent = 'Start';
                startBtn.classList.remove('btn-stop');
                startBtn.classList.add('btn-start');
            }
        }

        function resetStopwatch() {
            clearInterval(stopwatchInterval);
            stopwatchTime = 0;
            isStopwatchRunning = false;

            updateStopwatchDisplay();
            startBtn.textContent = 'Start';
            startBtn.classList.remove('btn-stop');
            startBtn.classList.add('btn-start');
        }

        startBtn.addEventListener('click', startStopwatch);
        resetBtn.addEventListener('click', resetStopwatch);

        // Goal tracking functionality
        const homeGoalBtn = document.getElementById('homeGoalBtn');
        const awayGoalBtn = document.getElementById('awayGoalBtn');
        const homeGoalsDisplay = document.getElementById('homeGoals');
        const awayGoalsDisplay = document.getElementById('awayGoals');

        function addGoal(team) {
            const goalEmoji = document.createElement('span');
            goalEmoji.textContent = '⚽️';
            goalEmoji.style.animation = 'goalPop 0.3s ease';

            if (team === 'home') {
                homeGoalsDisplay.appendChild(goalEmoji);
            } else {
                awayGoalsDisplay.appendChild(goalEmoji);
            }
        }

        homeGoalBtn.addEventListener('click', () => addGoal('home'));
        awayGoalBtn.addEventListener('click', () => addGoal('away'));

        console.log('Football Coach Stopwatch loaded successfully!');
    </script>
</body>
</html>
