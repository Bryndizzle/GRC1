<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Coach Stopwatch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #000000;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #000000;
            overflow: hidden;
        }

        header {
            background: #000000;
            color: white;
            padding: 40px 30px 20px;
            text-align: center;
            border-bottom: 2px solid #222;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 900;
            letter-spacing: 0.02em;
        }

        .tagline {
            font-size: 0.9em;
            opacity: 0.6;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .stopwatch-container {
            padding: 60px 30px;
            text-align: center;
        }

        .stopwatch-container h2 {
            margin-bottom: 10px;
            color: #fff;
            font-size: 1.2em;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .stopwatch-description {
            color: #666;
            margin-bottom: 60px;
            font-size: 0.9em;
            letter-spacing: 0.05em;
        }

        .stopwatch-display {
            background: #000000;
            padding: 60px 40px;
            margin-bottom: 50px;
            border: 3px solid #333;
        }

        .stopwatch-time {
            font-size: 6em;
            font-weight: 900;
            color: white;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.1em;
        }

        .stopwatch-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 60px;
        }

        .stopwatch-btn {
            padding: 18px 50px;
            border: 2px solid #fff;
            border-radius: 0;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            background: transparent;
            color: #fff;
        }

        .btn-start {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-start:hover {
            background: transparent;
            color: #fff;
        }

        .btn-stop {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-stop:hover {
            background: transparent;
            color: #fff;
        }

        .btn-lap {
            background: transparent;
            color: #fff;
            border-color: #fff;
        }

        .btn-lap:hover:not(:disabled) {
            background: #fff;
            color: #000;
        }

        .btn-lap:disabled {
            border-color: #333;
            color: #333;
            cursor: not-allowed;
        }

        .btn-reset {
            background: transparent;
            color: #fff;
            border-color: #fff;
        }

        .btn-reset:hover {
            background: #fff;
            color: #000;
        }

        .laps-container {
            margin-top: 40px;
            border-top: 2px solid #222;
            padding-top: 40px;
        }

        .laps-container h3 {
            color: #fff;
            margin-bottom: 30px;
            font-size: 1.2em;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .laps-list {
            background: #000000;
            padding: 0;
            max-height: 400px;
            overflow-y: auto;
        }

        .no-laps {
            color: #444;
            font-style: normal;
            text-align: center;
            padding: 40px 20px;
            letter-spacing: 0.05em;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            background: transparent;
            margin-bottom: 0;
            border-bottom: 1px solid #222;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lap-item:last-child {
            margin-bottom: 0;
        }

        .lap-number {
            font-weight: 700;
            color: #fff;
            flex: 1;
            text-align: left;
            letter-spacing: 0.05em;
            font-size: 0.9em;
        }

        .lap-split {
            font-family: 'Courier New', monospace;
            color: #fff;
            font-weight: 700;
            flex: 1;
            text-align: center;
            font-size: 1.1em;
        }

        .lap-total {
            font-family: 'Courier New', monospace;
            color: #666;
            flex: 1;
            text-align: right;
            font-size: 0.9em;
        }

        footer {
            background: #000000;
            padding: 30px 20px;
            text-align: center;
            color: #444;
            border-top: 2px solid #222;
            margin-top: 40px;
            font-size: 0.8em;
            letter-spacing: 0.1em;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .stopwatch-time {
                font-size: 2.5em;
            }

            .stopwatch-controls {
                flex-direction: column;
                gap: 10px;
            }

            .stopwatch-btn {
                width: 100%;
                padding: 12px 20px;
            }

            .lap-item {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }

            .lap-number,
            .lap-split,
            .lap-total {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>FOOTBALLREMIXED</h1>
            <p class="tagline">Stopwatch</p>
        </header>

        <div class="stopwatch-container">
            <h2>Timer</h2>
            <p class="stopwatch-description">Track drills & sessions</p>

            <div class="stopwatch-display">
                <div id="stopwatchTime" class="stopwatch-time">00:00.00</div>
            </div>

            <div class="stopwatch-controls">
                <button id="startBtn" class="stopwatch-btn btn-start">Start</button>
                <button id="lapBtn" class="stopwatch-btn btn-lap" disabled>Lap</button>
                <button id="resetBtn" class="stopwatch-btn btn-reset">Reset</button>
            </div>

            <div class="laps-container">
                <h3>Lap Times</h3>
                <div id="lapsList" class="laps-list">
                    <p class="no-laps">No lap times recorded yet</p>
                </div>
            </div>
        </div>

        <footer>
            <p>FOOTBALLREMIXED © 2026</p>
        </footer>
    </div>

    <script>
        // Stopwatch functionality
        let stopwatchInterval = null;
        let stopwatchTime = 0;
        let isStopwatchRunning = false;
        let lapTimes = [];
        let lapCounter = 1;

        const stopwatchDisplay = document.getElementById('stopwatchTime');
        const startBtn = document.getElementById('startBtn');
        const lapBtn = document.getElementById('lapBtn');
        const resetBtn = document.getElementById('resetBtn');
        const lapsList = document.getElementById('lapsList');

        function formatTime(milliseconds) {
            const totalSeconds = Math.floor(milliseconds / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const centiseconds = Math.floor((milliseconds % 1000) / 10);

            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(centiseconds).padStart(2, '0')}`;
        }

        function updateStopwatchDisplay() {
            stopwatchDisplay.textContent = formatTime(stopwatchTime);
        }

        function startStopwatch() {
            if (!isStopwatchRunning) {
                isStopwatchRunning = true;
                const startTime = Date.now() - stopwatchTime;

                stopwatchInterval = setInterval(() => {
                    stopwatchTime = Date.now() - startTime;
                    updateStopwatchDisplay();
                }, 10);

                startBtn.textContent = 'Stop';
                startBtn.classList.remove('btn-start');
                startBtn.classList.add('btn-stop');
                lapBtn.disabled = false;
            } else {
                isStopwatchRunning = false;
                clearInterval(stopwatchInterval);
                startBtn.textContent = 'Start';
                startBtn.classList.remove('btn-stop');
                startBtn.classList.add('btn-start');
            }
        }

        function recordLap() {
            if (isStopwatchRunning && stopwatchTime > 0) {
                const lapTime = stopwatchTime;
                const previousLapTime = lapTimes.length > 0 ? lapTimes[lapTimes.length - 1].time : 0;
                const splitTime = lapTime - previousLapTime;

                lapTimes.push({ time: lapTime, split: splitTime });

                // Remove "no laps" message if it exists
                const noLapsMessage = lapsList.querySelector('.no-laps');
                if (noLapsMessage) {
                    noLapsMessage.remove();
                }

                // Add new lap to the list (at the beginning)
                const lapItem = document.createElement('div');
                lapItem.className = 'lap-item';
                lapItem.innerHTML = `
                    <span class="lap-number">Lap ${lapCounter}</span>
                    <span class="lap-split">${formatTime(splitTime)}</span>
                    <span class="lap-total">${formatTime(lapTime)}</span>
                `;

                lapsList.insertBefore(lapItem, lapsList.firstChild);
                lapCounter++;
            }
        }

        function resetStopwatch() {
            clearInterval(stopwatchInterval);
            stopwatchTime = 0;
            isStopwatchRunning = false;
            lapTimes = [];
            lapCounter = 1;

            updateStopwatchDisplay();
            startBtn.textContent = 'Start';
            startBtn.classList.remove('btn-stop');
            startBtn.classList.add('btn-start');
            lapBtn.disabled = true;

            // Clear laps list
            lapsList.innerHTML = '<p class="no-laps">No lap times recorded yet</p>';
        }

        startBtn.addEventListener('click', startStopwatch);
        lapBtn.addEventListener('click', recordLap);
        resetBtn.addEventListener('click', resetStopwatch);

        console.log('Football Coach Stopwatch loaded successfully!');
    </script>
</body>
</html>
