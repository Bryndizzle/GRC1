<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Coach Stopwatch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #000000;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #000000;
            overflow: hidden;
        }

        header {
            background: #000000;
            color: white;
            padding: 40px 30px 20px;
            text-align: center;
            border-bottom: 2px solid #222;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 900;
            letter-spacing: 0.02em;
        }

        .tagline {
            font-size: 0.9em;
            opacity: 0.6;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .stopwatch-container {
            padding: 60px 30px;
            text-align: center;
        }

        .stopwatch-container h2 {
            margin-bottom: 10px;
            color: #fff;
            font-size: 1.2em;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .stopwatch-description {
            color: #666;
            margin-bottom: 60px;
            font-size: 0.9em;
            letter-spacing: 0.05em;
        }

        .stopwatch-display {
            background: #000000;
            padding: 60px 40px;
            margin-bottom: 50px;
            border: 3px solid #333;
        }

        .stopwatch-time {
            font-size: 6em;
            font-weight: 900;
            color: white;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.1em;
        }

        .stopwatch-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 60px;
        }

        .stopwatch-btn {
            padding: 18px 50px;
            border: 2px solid #fff;
            border-radius: 0;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            background: transparent;
            color: #fff;
        }

        .btn-start {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-start:hover {
            background: transparent;
            color: #fff;
        }

        .btn-stop {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-stop:hover {
            background: transparent;
            color: #fff;
        }

        .btn-reset {
            background: transparent;
            color: #fff;
            border-color: #fff;
        }

        .btn-reset:hover {
            background: #fff;
            color: #000;
        }

        .score-section {
            margin-top: 60px;
            border-top: 2px solid #222;
            padding-top: 40px;
        }

        .team-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
        }

        .team {
            flex: 1;
            max-width: 300px;
            text-align: center;
        }

        .team h3 {
            color: #fff;
            font-size: 1.2em;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .score-display {
            min-height: 120px;
            background: #000;
            border: 3px solid #333;
            padding: 30px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .score-number {
            font-size: 5em;
            font-weight: 900;
            color: #fff;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.1em;
            text-align: center;
        }

        .goal-times {
            margin-top: 15px;
            padding: 15px;
            background: #111;
            border: 1px solid #333;
            min-height: 50px;
            max-height: 150px;
            overflow-y: auto;
        }

        .goal-times h4 {
            color: #999;
            font-size: 0.75em;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .goal-time-item {
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            padding: 5px 0;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .goal-time-item:last-child {
            border-bottom: none;
        }

        .goal-time-label {
            color: #999;
            font-size: 0.85em;
        }

        .goal-time-value {
            color: #fff;
            font-weight: 600;
        }

        .no-goals {
            color: #555;
            font-size: 0.85em;
            font-style: italic;
            text-align: center;
            padding: 10px;
        }

        .goal-btn {
            padding: 12px 30px;
            border: 2px solid #fff;
            border-radius: 0;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: transparent;
            color: #fff;
            width: 100%;
        }

        .goal-btn:hover {
            background: #fff;
            color: #000;
        }

        .undo-btn {
            padding: 10px 20px;
            border: 1px solid #666;
            border-radius: 0;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: transparent;
            color: #666;
            width: 100%;
            margin-top: 10px;
            opacity: 0.6;
        }

        .undo-btn:hover:not(:disabled) {
            background: #333;
            color: #fff;
            border-color: #fff;
            opacity: 1;
        }

        .undo-btn:disabled {
            cursor: not-allowed;
            opacity: 0.3;
        }


        footer {
            background: #000000;
            padding: 30px 20px;
            text-align: center;
            color: #444;
            border-top: 2px solid #222;
            margin-top: 40px;
            font-size: 0.8em;
            letter-spacing: 0.1em;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .stopwatch-time {
                font-size: 2.5em;
            }

            .score-number {
                font-size: 3em;
            }

            .stopwatch-controls {
                flex-direction: column;
                gap: 10px;
            }

            .stopwatch-btn {
                width: 100%;
                padding: 12px 20px;
            }

            .team-container {
                flex-direction: column;
                gap: 30px;
            }

            .team {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>FOOTBALLREMIXED</h1>
            <p class="tagline">Stopwatch</p>
        </header>

        <div class="stopwatch-container">
            <h2>Timer</h2>
            <p class="stopwatch-description">Track drills & sessions</p>

            <div class="stopwatch-display">
                <div id="stopwatchTime" class="stopwatch-time">00:00.00</div>
            </div>

            <div class="stopwatch-controls">
                <button id="startBtn" class="stopwatch-btn btn-start">Start</button>
                <button id="resetBtn" class="stopwatch-btn btn-reset">Reset</button>
            </div>

            <div class="score-section">
                <div class="team-container">
                    <div class="team home-team">
                        <h3>Home Team</h3>
                        <div class="score-display">
                            <div class="score-number" id="homeScore">0</div>
                        </div>
                        <button id="homeGoalBtn" class="goal-btn">⚽️ Goal</button>
                        <button id="homeUndoBtn" class="undo-btn">↶ Undo</button>
                        <div class="goal-times">
                            <h4>Goal Times</h4>
                            <div id="homeGoalTimes">
                                <div class="no-goals">No goals yet</div>
                            </div>
                        </div>
                    </div>
                    <div class="team away-team">
                        <h3>Away Team</h3>
                        <div class="score-display">
                            <div class="score-number" id="awayScore">0</div>
                        </div>
                        <button id="awayGoalBtn" class="goal-btn">⚽️ Goal</button>
                        <button id="awayUndoBtn" class="undo-btn">↶ Undo</button>
                        <div class="goal-times">
                            <h4>Goal Times</h4>
                            <div id="awayGoalTimes">
                                <div class="no-goals">No goals yet</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>FOOTBALLREMIXED © 2026</p>
        </footer>
    </div>

    <script>
        // Stopwatch functionality
        let stopwatchInterval = null;
        let stopwatchTime = 0;
        let isStopwatchRunning = false;

        const stopwatchDisplay = document.getElementById('stopwatchTime');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        function formatTime(milliseconds) {
            const totalSeconds = Math.floor(milliseconds / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const centiseconds = Math.floor((milliseconds % 1000) / 10);

            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(centiseconds).padStart(2, '0')}`;
        }

        function updateStopwatchDisplay() {
            stopwatchDisplay.textContent = formatTime(stopwatchTime);
        }

        function startStopwatch() {
            if (!isStopwatchRunning) {
                isStopwatchRunning = true;
                const startTime = Date.now() - stopwatchTime;

                stopwatchInterval = setInterval(() => {
                    stopwatchTime = Date.now() - startTime;
                    updateStopwatchDisplay();
                }, 10);

                startBtn.textContent = 'Stop';
                startBtn.classList.remove('btn-start');
                startBtn.classList.add('btn-stop');
            } else {
                isStopwatchRunning = false;
                clearInterval(stopwatchInterval);
                startBtn.textContent = 'Start';
                startBtn.classList.remove('btn-stop');
                startBtn.classList.add('btn-start');
            }
        }

        function resetStopwatch() {
            clearInterval(stopwatchInterval);
            stopwatchTime = 0;
            isStopwatchRunning = false;

            updateStopwatchDisplay();
            startBtn.textContent = 'Start';
            startBtn.classList.remove('btn-stop');
            startBtn.classList.add('btn-start');
        }

        startBtn.addEventListener('click', startStopwatch);
        resetBtn.addEventListener('click', resetStopwatch);

        // Score tracking functionality
        const homeGoalBtn = document.getElementById('homeGoalBtn');
        const awayGoalBtn = document.getElementById('awayGoalBtn');
        const homeUndoBtn = document.getElementById('homeUndoBtn');
        const awayUndoBtn = document.getElementById('awayUndoBtn');
        const homeScoreDisplay = document.getElementById('homeScore');
        const awayScoreDisplay = document.getElementById('awayScore');
        const homeGoalTimesDisplay = document.getElementById('homeGoalTimes');
        const awayGoalTimesDisplay = document.getElementById('awayGoalTimes');

        let homeScore = 0;
        let awayScore = 0;
        let homeGoalTimes = [];
        let awayGoalTimes = [];

        function updateUndoButtons() {
            homeUndoBtn.disabled = homeScore === 0;
            awayUndoBtn.disabled = awayScore === 0;
        }

        function updateScoreDisplay() {
            homeScoreDisplay.textContent = homeScore;
            awayScoreDisplay.textContent = awayScore;
        }

        function updateGoalTimesDisplay(team) {
            const times = team === 'home' ? homeGoalTimes : awayGoalTimes;
            const display = team === 'home' ? homeGoalTimesDisplay : awayGoalTimesDisplay;

            if (times.length === 0) {
                display.innerHTML = '<div class="no-goals">No goals yet</div>';
            } else {
                display.innerHTML = times.map((time, index) => `
                    <div class="goal-time-item">
                        <span class="goal-time-label">Goal ${index + 1}</span>
                        <span class="goal-time-value">${time}</span>
                    </div>
                `).join('');
            }
        }

        function addGoal(team) {
            const goalTime = formatTime(stopwatchTime);

            if (team === 'home') {
                homeScore++;
                homeGoalTimes.push(goalTime);
                updateGoalTimesDisplay('home');
            } else {
                awayScore++;
                awayGoalTimes.push(goalTime);
                updateGoalTimesDisplay('away');
            }
            updateScoreDisplay();
            updateUndoButtons();
        }

        function removeGoal(team) {
            if (team === 'home' && homeScore > 0) {
                homeScore--;
                homeGoalTimes.pop();
                updateGoalTimesDisplay('home');
            } else if (team === 'away' && awayScore > 0) {
                awayScore--;
                awayGoalTimes.pop();
                updateGoalTimesDisplay('away');
            }
            updateScoreDisplay();
            updateUndoButtons();
        }

        homeGoalBtn.addEventListener('click', () => addGoal('home'));
        awayGoalBtn.addEventListener('click', () => addGoal('away'));
        homeUndoBtn.addEventListener('click', () => removeGoal('home'));
        awayUndoBtn.addEventListener('click', () => removeGoal('away'));

        // Initialize undo buttons state
        updateUndoButtons();

        console.log('Football Coach Stopwatch loaded successfully!');
    </script>
</body>
</html>
